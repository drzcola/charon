[project]
name = "charon"
version = "0.1.0"
description = "Modular Kerberos post-exploitation framework"
requires-python = ">=3.11"
dependencies = [
    "prompt_toolkit"
]

[project.scripts]
charon = "charon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charon"]
