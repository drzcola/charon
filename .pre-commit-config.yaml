# .pre-commit-config.yaml
# Run: pre-commit install   (once, to wire up the git hook)
#      pre-commit run --all-files   (to check everything)

exclude: '^vendor/'   # never lint/format the impacket submodule

repos:
  # ---- General hygiene ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml            # validates pyproject.toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
      - id: detect-private-key    # SECURITY: block committed PEM/SSH keys

  # ---- Ruff: linter + formatter (replaces black, isort, flake8) ----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff                  # lint
        args: [--fix]
      - id: ruff-format           # format
